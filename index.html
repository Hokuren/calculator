<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/cal.js" defer></script>
</head>
<body>
    <div class="calculator">
        <div class="screen">
            <div class="after">

            </div>
            <div class="current">

            </div>
        </div>
        <div class="controls">  
            
            <button class="btn btn-fn" value="ac">AC</button>
            <button class="btn btn-fn" value="ac2">+/−</button>
            <button class="btn btn-fn" value="pot">%</button>
            <button class="btn btn-op" value="divi">÷</button>
            <button class="btn btn-no" value="7">7</button>
            <button class="btn btn-no" value="8">8</button>
            <button class="btn btn-no" value="9">9</button>
            <button class="btn btn-op" value="mul">x</button>
            <button class="btn btn-no" value="4">4</button>
            <button class="btn btn-no" value="5">5</button>
            <button class="btn btn-no" value="6">6</button>
            <button class="btn btn-op" value="res">-</button>
            <button class="btn btn-no" value="1">1</button>
            <button class="btn btn-no" value="2">2</button>
            <button class="btn btn-no" value="3">3</button>
            <button class="btn btn-op" value="sum">+</button>
            <button class="btn btn-no cero" value="0">0</button>
            <button class="btn btn-no" value=".">.</button>
            <button class="btn btn-op" value="igual">=</button>
        </div>
    </div>    
</body>
</html>
